name: Python CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    name: ${{ matrix.name }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ruff
            command: uv run ruff check .
          - name: Ruff Format
            command: uv run ruff format --check .
          - name: Ty
            command: uv run ty check
          - name: Pytest
            command: uv run pytest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run check in Docker
        env:
          CHECK_COMMAND: ${{ matrix.command }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/backend:/source:ro" \
            -w /work \
            -e CHECK_COMMAND \
            ghcr.io/astral-sh/uv:python3.13-bookworm-slim \
            sh -c 'cp -R /source/. /work/ && uv sync --frozen && sh -c "$CHECK_COMMAND"'

  frontend-build:
    name: Frontend Build
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build frontend in Docker
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/frontend:/source:ro" \
            -w /work \
            node:22-alpine \
            sh -c 'cp -R /source/. /work/ && npm ci && npm run build'

  docker-build:
    name: Docker Build (${{ matrix.service }})
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          docker build --pull \
            -f "$SERVICE/Dockerfile" \
            -t "counterapp-$SERVICE:github-ci" \
            "./$SERVICE"

  docker-build-alpine:
    name: Docker Build (Alpine)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Alpine image
        run: |
          docker build --pull \
            -f backend/Dockerfile.alpine \
            -t counterapp-backend:alpine-ci \
            ./backend

  docker-build-distroless:
    name: Docker Build (Distroless)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Distroless image
        run: |
          docker build --pull \
            -f backend/Dockerfile.distroless \
            -t counterapp-backend:distroless-ci \
            ./backend
